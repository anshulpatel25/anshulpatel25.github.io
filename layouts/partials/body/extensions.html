{{ if .Page.Store.Get "hasMermaid" }}
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

  const getTheme = () => {
    if (document.body.classList.contains("colorscheme-dark")) return "dark";
    if (document.body.classList.contains("colorscheme-light")) return "default";
    const scheme = localStorage.getItem("colorscheme");
    if (scheme) return scheme === "dark" ? "dark" : "default";
    return window.matchMedia &&
      window.matchMedia("(prefers-color-scheme: dark)").matches
      ? "dark"
      : "default";
  };

  document.querySelectorAll("pre.mermaid, .mermaid").forEach((el) => {
    el.setAttribute("data-mermaid-code", el.textContent);
  });

  mermaid.initialize({
    startOnLoad: true,
    theme: getTheme(),
  });

  document.addEventListener("themeChanged", async () => {
    mermaid.initialize({
      startOnLoad: false,
      theme: getTheme(),
    });
    document.querySelectorAll("[data-mermaid-code]").forEach((el) => {
      el.removeAttribute("data-processed");
      el.innerHTML = el.getAttribute("data-mermaid-code");
    });
    await mermaid.run();
  });
</script>
{{ end }}
